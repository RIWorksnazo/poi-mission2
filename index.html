<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - INFO MONITOR</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #050505; color: #fff; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        body::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; }
        #money-display { font-size: 5vw; font-weight: bold; color: #0f0; background: rgba(0, 50, 0, 0.6); border: 4px solid #0f0; padding: 15px; text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px #0f0; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); letter-spacing: 5px; }
        #mission-container { display: flex; flex-direction: row; gap: 20px; flex: 1; overflow: hidden; }
        .mission-column { flex: 1; background: rgba(0, 20, 50, 0.6); border: 2px solid #0af; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0, 170, 255, 0.2); overflow-y: auto; }
        .mission-title { background: rgba(0, 170, 255, 0.4); color: #fff; padding: 15px; font-size: 24px; font-weight: bold; text-align: center; border-bottom: 2px solid #0af; letter-spacing: 3px; position: sticky; top: 0; z-index: 10; }
        .mission-content { padding: 20px; font-size: 20px; line-height: 1.6; }
        .mission-item { margin-bottom: 15px; border-bottom: 1px dashed rgba(0, 170, 255, 0.4); padding-bottom: 10px; transition: all 0.3s; }
        .mission-item::before { content: "▶ "; color: #0af; }
        .cleared { color: #555; text-decoration: line-through; }
        .cleared::before { content: "✔ "; color: #555; }
        
        #footer-info { position: absolute; bottom: 10px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 18px; color: #888; z-index: 101; }
        #timer { color: #ff0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="money-display">SALARY: ¥0</div>
    
    <div id="mission-container">
        <div class="mission-column">
            <div class="mission-title">MISSION LIST</div>
            <div class="mission-content" id="list-mission"></div>
        </div>
        <div class="mission-column">
            <div class="mission-title">HINT / LOG</div>
            <div class="mission-content" id="list-hint"></div>
        </div>
    </div>

    <div id="footer-info">
        <div id="timer">ELAPSED TIME: 00:00 (Press 'R' to reset)</div>
        <div id="status">SYS: STANDBY...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let startTime = localStorage.getItem('poisuteStartTime');
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem('poisuteStartTime', startTime);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                startTime = Date.now();
                localStorage.setItem('poisuteStartTime', startTime);
                updateTimerDisplay();
            }
        });

        let currentElapsedMinutes = 0;

        function updateTimerDisplay() {
            const now = Date.now();
            const elapsedMs = now - startTime;
            currentElapsedMinutes = Math.floor(elapsedMs / 60000);
            const seconds = Math.floor((elapsedMs % 60000) / 1000);
            
            const minStr = String(currentElapsedMinutes).padStart(2, '0');
            const secStr = String(seconds).padStart(2, '0');
            document.getElementById('timer').innerText = `ELAPSED TIME: ${minStr}:${secStr} (Press 'R' to reset)`;
        }
        setInterval(updateTimerDisplay, 1000); 

        let isFetching = false;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                updateUI(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                isFetching = false;
                setTimeout(fetchData, 2000); 
            }
        }

        function updateUI(data) {
            document.getElementById('money-display').innerText = `SALARY: ¥${data.totalMoney}`;

            const listMission = document.getElementById('list-mission');
            const listHint = document.getElementById('list-hint');
            listMission.innerHTML = "";
            listHint.innerHTML = "";

            data.missions.forEach(m => {
                if (m.visible && m.name) {
                    const div = document.createElement('div');
                    div.className = "mission-item" + (m.cleared ? " cleared" : "");
                    div.innerText = m.name;
                    listMission.appendChild(div);
                }
                
                // G列に文字があり、かつH列の時間を経過しているもの
                if (m.hintText && m.hintTime > 0 && currentElapsedMinutes >= m.hintTime) {
                    const hintDiv = document.createElement('div');
                    hintDiv.className = "mission-item"; 
                    hintDiv.innerText = m.hintText;
                    hintDiv.style.color = "#ff0"; 
                    listHint.appendChild(hintDiv);
                }
            });
        }

        fetchData();
    </script>
</body>
</html>
