<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - MISSION CONTROL</title>
    <style>
        body { margin: 0; overflow-x: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; padding: 30px; }
        h1 { color: #fff; border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 28px; letter-spacing: 2px; }
        .dashboard { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background-color: #111; border: 1px solid #333; padding: 20px 25px; border-radius: 8px; min-width: 220px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #888; letter-spacing: 1px; }
        .card .value { font-size: 26px; font-weight: bold; color: #ffeb3b; }
        table { width: 100%; border-collapse: collapse; background-color: #111; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #222; }
        th { background-color: #1a1a1a; color: #aaa; font-size: 14px; letter-spacing: 1px; }
        tr:hover { background-color: #161616; }
        .status-cleared { color: #00e676; font-weight: bold; }
        .status-progress { color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>POISUTE 2 : MISSION CONTROL</h1>

    <!-- ダッシュボード（上部のステータス表示） -->
    <div class="dashboard">
        <div class="card">
            <h3>現在解いた問題数</h3>
            <div class="value" id="total-questions">0 問</div>
        </div>
        <div class="card">
            <h3>現在の給料</h3>
            <div class="value" id="total-money">¥0</div>
        </div>
        <div class="card">
            <h3>現在挑戦中のMISSION</h3>
            <div class="value" id="current-mission" style="font-size: 20px; color: #58a6ff;">読み込み中...</div>
        </div>
    </div>

    <!-- ミッション一覧テーブル -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>ミッション名</th>
                <th>状態</th>
            </tr>
        </thead>
        <tbody id="mission-table-body">
            <tr>
                <td colspan="3" style="text-align: center; color: #666;">データを取得中...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";

        async function fetchMissionData() {
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();

                // 1. 現在解いた問題数の更新
                document.getElementById('total-questions').innerText = data.totalQuestions + " 問";

                // 2. 現在の給料の更新
                document.getElementById('total-money').innerText = "¥" + data.totalMoney.toLocaleString();

                // 3. 現在挑戦中のMISSIONを判定
                let activeMissionName = "全クリアまたは未開始";
                for (const m of data.missions) {
                    if (m.visible && !m.cleared) {
                        activeMissionName = m.name;
                        break;
                    }
                }
                document.getElementById('current-mission').innerText = activeMissionName;

                // 4. テーブルの描画
                const tbody = document.getElementById('mission-table-body');
                tbody.innerHTML = "";

                data.missions.forEach(m => {
                    if (m.visible) {
                        const tr = document.createElement('tr');
                        const statusText = m.cleared ? '<span class="status-cleared">CLEAR 🟢</span>' : '<span class="status-progress">挑戦中 🟡</span>';
                        
                        tr.innerHTML = `
                            <td>${m.id}</td>
                            <td>${m.name}</td>
                            <td>${statusText}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

            } catch (error) {
                console.error("データ取得エラー:", error);
                document.getElementById('current-mission').innerText = "通信エラー 🔴";
            }
        }

        fetchMissionData();
        setInterval(fetchMissionData, 2000);
    </script>
</body>
</html>
