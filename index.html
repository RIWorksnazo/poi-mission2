<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - INFO MONITOR</title>
    <style>
        /* 全体のポップな背景とフォント設定 */
        body { 
            margin: 0; padding: 20px; 
            background-color: #fdf6e3; /* 明るくポップなクリーム色 */
            color: #333; 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', Meiryo, sans-serif;
            box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* 給料表示（オレンジの丸みのあるデザイン） */
        #money-display { 
            font-size: 5vw; font-weight: bold; color: #fff; 
            background: #ff9800; 
            border-radius: 15px;
            padding: 15px; text-align: center; margin-bottom: 20px; 
            box-shadow: 0 6px 0 #f57c00; 
            letter-spacing: 2px; 
        }
        
        #mission-container { display: flex; flex-direction: row; gap: 20px; flex: 1; overflow: hidden; }
        
        /* ミッションとヒントの枠（水色） */
        .mission-column { 
            flex: 1; background: #fff; 
            border: 4px solid #4fc3f7; 
            border-radius: 15px;
            display: flex; flex-direction: column; 
            box-shadow: 0 6px 0 #0288d1; 
            overflow-y: auto; 
        }
        .mission-title { 
            background: #4fc3f7; color: #fff; 
            padding: 15px; font-size: 24px; font-weight: bold; text-align: center; 
            letter-spacing: 2px; position: sticky; top: 0; z-index: 10; 
        }
        .mission-content { padding: 20px; font-size: 20px; line-height: 1.6; }
        
        /* リストのカード風デザイン */
        .mission-item { 
            background: #f1f8e9; 
            margin-bottom: 15px; border-radius: 10px;
            padding: 15px; 
            border: 2px solid #c5e1a5;
            transition: all 0.3s; 
            font-weight: bold;
        }
        .mission-item::before { content: "⭐ "; color: #ffa000; }
        
        /* クリア済みのデザイン */
        .cleared { 
            background: #eeeeee; border-color: #cccccc; color: #999;
            text-decoration: line-through; 
        }
        .cleared::before { content: "✅ "; }
        
        /* ヒント専用のデザイン（黄色） */
        .hint-item {
            background: #fff9c4; 
            border: 2px solid #fff59d;
            color: #e65100;
        }
        .hint-item::before { content: "💡 "; }

        /* タイマー表示を削除し、右下にステータスのみ配置 */
        #footer-info { position: absolute; bottom: 10px; right: 20px; font-size: 18px; color: #666; z-index: 101; font-weight: bold; }
    </style>
</head>
<body>

    <div id="money-display">SALARY: ¥0</div>
    
    <div id="mission-container">
        <div class="mission-column">
            <div class="mission-title">MISSION LIST</div>
            <div class="mission-content" id="list-mission"></div>
        </div>
        <div class="mission-column">
            <div class="mission-title">HINT / LOG</div>
            <div class="mission-content" id="list-hint"></div>
        </div>
    </div>

    <div id="footer-info">
        <div id="status">SYS: STANDBY...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let startTime = localStorage.getItem('poisuteStartTime');
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem('poisuteStartTime', startTime);
        }

        // Rキーを押したときのリセット機能（裏で動いています）
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                startTime = Date.now();
                localStorage.setItem('poisuteStartTime', startTime);
                updateTimer(); // 表示はないですが、裏の時間を0に戻します
            }
        });

        let currentElapsedMinutes = 0;

        // 裏で経過時間を計算する機能
        function updateTimer() {
            const now = Date.now();
            const elapsedMs = now - startTime;
            currentElapsedMinutes = Math.floor(elapsedMs / 60000);
        }
        setInterval(updateTimer, 1000); 

        let isFetching = false;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;

            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                updateUI(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                isFetching = false;
                setTimeout(fetchData, 2000); 
            }
        }

        function updateUI(data) {
            document.getElementById('money-display').innerText = `SALARY: ¥${data.totalMoney}`;

            const listMission = document.getElementById('list-mission');
            const listHint = document.getElementById('list-hint');
            listMission.innerHTML = "";
            listHint.innerHTML = "";

            data.missions.forEach(m => {
                // ▼ 左枠：ミッション（E列のサイト表示にチェックがあるもの）
                if (m.visible && m.name) {
                    const div = document.createElement('div');
                    div.className = "mission-item" + (m.cleared ? " cleared" : "");
                    div.innerText = m.name;
                    listMission.appendChild(div);
                }
                
                // ▼ 右枠：ヒント（G列に文字があり、かつH列の時間を経過しているもの）
                if (m.hintText && Number(m.hintTime) > 0 && currentElapsedMinutes >= Number(m.hintTime)) {
                    const hintDiv = document.createElement('div');
                    hintDiv.className = "mission-item hint-item"; 
                    hintDiv.innerText = m.hintText;
                    listHint.appendChild(hintDiv);
                }
            });
        }

        fetchData();
    </script>
</body>
</html>
