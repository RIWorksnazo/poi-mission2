<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - MISSION CONTROL</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px 20px;
            border-radius: 6px;
            min-width: 200px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #8b949e;
        }
        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: #f0f6fc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #21262d;
            color: #c9d1d9;
        }
        tr:hover {
            background-color: #1f242c;
        }
        .status-cleared {
            color: #3fb950;
            font-weight: bold;
        }
        .status-progress {
            color: #d29922;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>POISUTE 2 : CONTROL PANEL</h1>

    <!-- ダッシュボード（上部のステータス表示） -->
    <div class="dashboard">
        <div class="card">
            <h3>現在解いた問題数</h3>
            <div class="value" id="total-questions">0 問</div>
        </div>
        <div class="card">
            <h3>現在の給料</h3>
            <div class="value" id="total-money">¥0</div>
        </div>
        <div class="card">
            <h3>現在挑戦中のMISSION</h3>
            <div class="value" id="current-mission" style="font-size: 18px; color: #58a6ff;">読み込み中...</div>
        </div>
    </div>

    <!-- ミッション一覧テーブル -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>ミッション名</th>
                <th>状態</th>
                <th>報酬</th>
                <th>問題数</th>
            </tr>
        </thead>
        <tbody id="mission-table-body">
            <tr>
                <td colspan="5" style="text-align: center;">データを取得中...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // ▼ あなたのGASのURLを入れてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";

        async function fetchMissionData() {
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();

                // 1. 現在解いた問題数の更新
                document.getElementById('total-questions').innerText = data.totalQuestions + " 問";

                // 2. 現在の給料の更新
                document.getElementById('total-money').innerText = "¥" + data.totalMoney.toLocaleString();

                // 3. 現在挑戦中のMISSIONを判定して表示
                let activeMissionName = "なし（全クリアまたは未開始）";
                for (const m of data.missions) {
                    // visibleがtrueかつ、まだclearedがfalseのものを「現在挑戦中」とする
                    if (m.visible && !m.cleared) {
                        activeMissionName = m.name;
                        break;
                    }
                }
                document.getElementById('current-mission').innerText = activeMissionName;

                // 4. テーブルの描画
                const tbody = document.getElementById('mission-table-body');
                tbody.innerHTML = "";

                data.missions.forEach(m => {
                    // サイト表示（visible）がONのものだけテーブルに表示する例
                    if (m.visible) {
                        const tr = document.createElement('tr');
                        
                        const statusText = m.cleared ? '<span class="status-cleared">CLEAR 🟢</span>' : '<span class="status-progress">挑戦中 🟡</span>';
                        
                        tr.innerHTML = `
                            <td>${m.id}</td>
                            <td>${m.name}</td>
                            <td>${statusText}</td>
                            <td>¥${m.hints ? '---' : ''}</td> <!-- 必要に応じて報酬列を調整してください -->
                            <td>-</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

            } catch (error) {
                console.error("データ取得エラー:", error);
                document.getElementById('current-mission').innerText = "通信エラー 🔴";
            }
        }

        // 初回実行 ＆ 2秒ごとに自動更新
        fetchMissionData();
        setInterval(fetchMissionData, 2000);
    </script>
</body>
</html>
